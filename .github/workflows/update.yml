name: Update

# OpenAI publishes to its apt repository whenever it likes, so this polls
# rather than waits for a webhook it will never get.
#
# The version only reaches trunk after it has actually built and run on both
# architectures. That is why this pushes straight to trunk instead of opening
# a pull request: a PR raised by GITHUB_TOKEN does not trigger workflows, so
# an auto-merged one would land unverified.
#
# Once a week the same run also moves flake.lock. nixpkgs is not just a build
# tool here: autoPatchelfHook links Electron against the glibc, GTK and NSS of
# whichever nixpkgs builds it, and consumers take the result prebuilt from
# Cachix rather than following their own nixpkgs. So a stale lock is a stale
# set of libraries in everyone's closure, and a second copy of them alongside
# the system's. The window is shared with the other danielbodart flakes, two
# hours before the NixOS configuration that consumes them moves its own
# nixpkgs-unstable, so the two usually settle on the same nixos-unstable
# revision and share those store paths.
#
# The bumped lock goes through the same verify job as a new release, so the
# build that lands is one that has already been pushed to Cachix. That
# matters doubly here: a push made with GITHUB_TOKEN does not trigger CI, so
# nothing else would ever build it.
on:
  schedule:
    - cron: "17 * * * *"
    # Sunday 21:23 UTC. The "Update flake.lock" step matches this exact
    # string, so change both together.
    - cron: "23 21 * * 0"
  workflow_dispatch:
    inputs:
      update-lock:
        description: Also run nix flake update, as the weekly run does
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: update
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      updated: ${{ steps.update.outputs.updated }}
      version: ${{ steps.update.outputs.version }}
      previous: ${{ steps.update.outputs.previous }}
      locked: ${{ steps.lock.outputs.locked }}
      moved: ${{ steps.lock.outputs.moved }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            access-tokens = github.com=${{ secrets.GITHUB_TOKEN }}

      - name: Check OpenAI's apt repository for a newer release
        id: update
        run: |
          previous="$(jq -r .version sources.json)"
          echo "previous=$previous" >>"$GITHUB_OUTPUT"

          nix develop --command ./scripts/update.sh

          version="$(jq -r .version sources.json)"
          echo "version=$version" >>"$GITHUB_OUTPUT"

          if git diff --quiet -- sources.json; then
            echo "updated=false" >>"$GITHUB_OUTPUT"
            echo "Already at $previous." >>"$GITHUB_STEP_SUMMARY"
          else
            echo "updated=true" >>"$GITHUB_OUTPUT"
            echo "\`$previous\` -> \`$version\`" >>"$GITHUB_STEP_SUMMARY"
          fi

      # The whole lock, not just nixpkgs: it is the only input, and keeping
      # the step general means a new one is not quietly left behind.
      - name: Update flake.lock
        id: lock
        if: github.event.schedule == '23 21 * * 0' || inputs.update-lock
        run: |
          cp flake.lock "$RUNNER_TEMP/flake.lock.before"
          nix flake update

          if git diff --quiet -- flake.lock; then
            echo "locked=false" >>"$GITHUB_OUTPUT"
            echo "flake.lock already current." >>"$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          # "nixpkgs d6524aa -> 1c89083" for each input whose revision moved.
          moved="$(jq -rn \
            --slurpfile before "$RUNNER_TEMP/flake.lock.before" \
            --slurpfile after flake.lock '
              [ $after[0].nodes | to_entries[]
                | select(.value.locked)
                | .key as $name
                | (.value.locked.rev // .value.locked.narHash) as $new
                | ($before[0].nodes[$name].locked
                    | if . == null then "new" else (.rev // .narHash) end) as $old
                | select($old != $new)
                | "\($name) \($old[0:7]) -> \($new[0:7])" ]
              | join(", ")')"
          # Same revision, new narHash: rare, but still worth landing.
          [ -n "$moved" ] || moved="inputs re-locked at the same revisions"
          echo "locked=true" >>"$GITHUB_OUTPUT"
          echo "moved=$moved" >>"$GITHUB_OUTPUT"
          echo "flake.lock: $moved" >>"$GITHUB_STEP_SUMMARY"

      - name: Upload the candidate sources.json and flake.lock
        if: steps.update.outputs.updated == 'true' || steps.lock.outputs.locked == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sources
          path: |
            sources.json
            flake.lock
          retention-days: 1

  verify:
    needs: check
    if: needs.check.outputs.updated == 'true' || needs.check.outputs.locked == 'true'
    strategy:
      fail-fast: true
      matrix:
        include:
          - runner: ubuntu-latest
            system: x86_64-linux
          - runner: ubuntu-24.04-arm
            system: aarch64-linux
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: sources

      - uses: ./.github/actions/build
        with:
          system: ${{ matrix.system }}
          cachix-auth-token: ${{ secrets.CACHIX_AUTH_TOKEN }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

  publish:
    needs: [check, verify]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: sources

      - name: Commit and tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          UPDATED: ${{ needs.check.outputs.updated }}
          VERSION: ${{ needs.check.outputs.version }}
          PREVIOUS: ${{ needs.check.outputs.previous }}
          LOCKED: ${{ needs.check.outputs.locked }}
          MOVED: ${{ needs.check.outputs.moved }}
          REPOSITORY: ${{ github.repository }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # The lock first, so that a release commit in the same run is the
          # one its tag points at.
          if [ "$LOCKED" = true ]; then
            git add flake.lock
            git commit \
              -m "flake.lock: $MOVED" \
              -m "Weekly bump, in the window shared with the other danielbodart flakes. Built and run on x86_64-linux and aarch64-linux, and pushed to Cachix, before landing."
          fi

          if [ "$UPDATED" != true ]; then
            git pull --rebase origin trunk
            git push origin HEAD:trunk
            exit 0
          fi

          git add sources.json
          git commit \
            -m "chatgpt-desktop: $PREVIOUS -> $VERSION" \
            -m "Hashes taken from OpenAI's signed apt index. Built and run on x86_64-linux and aarch64-linux before landing."
          git pull --rebase origin trunk
          git push origin HEAD:trunk

          # A tag per release, so a consumer can pin one exactly.
          git tag -a "v$VERSION" -m "chatgpt-desktop $VERSION"
          git push origin "v$VERSION"

          # printf rather than a heredoc, whose body would carry this block's
          # YAML indentation into the release notes.
          printf '%s\n' \
            "ChatGPT Desktop \`$VERSION\`, repackaged from OpenAI's apt repository." \
            "" \
            "Upstream documentation: https://learn.chatgpt.com/docs/linux/linux-app" \
            "" \
            "Pin this version:" \
            "" \
            '```nix' \
            "inputs.chatgpt-desktop.url = \"github:$REPOSITORY/v$VERSION\";" \
            '```' \
            >notes.md

          gh release create "v$VERSION" \
            --title "chatgpt-desktop $VERSION" \
            --notes-file notes.md
